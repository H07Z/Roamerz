<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roamerz - Living World Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f12;
      font-family: monospace;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f12;
    }
    canvas {
      display: block;
      background: #1a2a1a;
      image-rendering: pixelated;
    }
    #loading {
      position: absolute;
      color: #8f8;
      font-size: 14px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading">INITIALIZING...</div>
    <canvas id="game-canvas"></canvas>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
